<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طراحی نقشه ساختمان</title>
    <!-- اضافه کردن فونت فارسی -->
    <link href="https://v1.fontapi.ir/css/Vazirmatn" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="toolbar">
        <button onclick="undo()">بازگشت</button>
        <button onclick="changeZoom(0.1)">زوم +</button>
        <button onclick="changeZoom(-0.1)">زوم -</button>
        <button onclick="resetProject()" style="color: red;">پروژه جدید</button>
        <button onclick="window.print()">چاپ نقشه</button>
    </div>
    <div id="canvas-container">
        <svg id="main-svg" viewBox="0 0 1600 1100"></svg>
    </div>
    <script src="app.js"></script>
</body>
</html>
