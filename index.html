<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اپلیکیشن طراحی پلان ساختمان</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>طراحی هوشمند پلان ساختمان</h1>
            <div class="view-switch">
                <button id="view-2d-btn" class="active">نمای دو بعدی</button>
                <button id="view-3d-btn">نمای سه بعدی</button>
            </div>
        </header>

        <main>
            <div id="canvas-container">
                <svg id="floorplan-svg"></svg>
                <div id="three-container" style="display: none;"></div>
                <div class="zoom-controls">
                    <button id="zoom-in-btn">+</button>
                    <button id="zoom-out-btn">-</button>
                    <button id="reset-zoom-btn">⟳</button>
                </div>
            </div>

            <aside class="control-panel">
                <div class="card">
                    <h2>پارامترهای اصلی</h2>
                    <div class="form-group">
                        <label for="ground-width">عرض زمین (متر)</label>
                        <input type="number" id="ground-width" value="10">
                    </div>
                    <div class="form-group">
                        <label for="ground-length">طول زمین (متر)</label>
                        <input type="number" id="ground-length" value="25">
                    </div>
                    <div class="form-group">
                        <label for="bedrooms">تعداد خواب</label>
                        <input type="number" id="bedrooms" value="2" min="1" max="4">
                    </div>
                    <div class="form-group">
                        <label for="floors">تعداد طبقات</label>
                        <input type="number" id="floors" value="1" min="1">
                    </div>
                     <div class="form-group">
                        <label for="structure-type">نوع سازه</label>
                        <select id="structure-type">
                            <option value="concrete">بتنی</option>
                            <option value="steel">فلزی</option>
                        </select>
                    </div>
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="auto-columns" checked>
                        <label for="auto-columns">ستون‌گذاری هوشمند</label>
                    </div>
                    <button id="generate-btn" class="btn-primary">اجرای طراحی</button>
                </div>

                <div class="card">
                    <h2>ابزارها و ویرایش</h2>
                    <div class="tool-buttons">
                        <button id="pan-tool-btn" class="tool-btn active" title="ابزار جابجایی (Pan)">🖐️</button>
                        <button id="draw-tool-btn" class="tool-btn" title="ابزار ترسیم دیوار">✏️</button>
                    </div>
                    <button id="add-room-btn">افزودن اتاق</button>
                    <button id="add-balcony-btn">افزودن بالکن</button>
                    <button id="remove-balcony-btn">حذف بالکن</button>
                </div>

                 <div class="card">
                    <h2>تاریخچه (Undo/Redo)</h2>
                     <div class="history-controls">
                        <button id="undo-btn" title="واگرد (Ctrl+Z)">⟲</button>
                        <button id="redo-btn" title="ازنو (Ctrl+Y)">⟳</button>
                    </div>
                </div>

                <div class="card">
                    <h2>خروجی</h2>
                    <button id="save-storage-btn">ذخیره نقشه</button>
                    <button id="load-storage-btn">بازیابی نقشه</button>
                    <button id="export-svg-btn">خروجی SVG</button>
                    <button id="print-btn">چاپ</button>
                </div>
            </aside>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
