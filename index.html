<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>طراحی پلان و اسکلت سه‌بعدی ساختمان</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🏢</div>
        <div>
          <strong>مهندسی و طراحی پلان ساختمان</strong>
          <small>طراحی ۲بعدی + شبیه‌ساز اسکلت سه‌بعدی طبقات</small>
        </div>
      </div>

      <div class="mode-switch" role="tablist">
        <button type="button" class="mode-tab is-active" id="view2dBtn">📐 پلان ۲ بعدی</button>
        <button type="button" class="mode-tab" id="view3dBtn">🧊 اسکلت ۳ بعدی</button>
      </div>

      <div class="top-actions">
        <button type="button" class="action-btn danger" id="newProjectBtn" title="پاک کردن و شروع نقشه جدید">پروژه جدید</button>
        <button type="button" class="action-btn" id="undoBtn" title="واگرد">↶ برگشت</button>
        <button type="button" class="action-btn" id="printBtn" title="چاپ">🖨 چاپ</button>
        <button type="button" class="action-btn" id="exportSvgBtn" title="خروجی SVG">⬇ خروجی پلان</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel control-panel">
        <div class="panel-head">
          <p class="eyebrow">مشخصات سازه و پلان</p>
          <h1>تنظیمات معماری و اسکلت</h1>
        </div>

        <div class="wizard">
          <div class="field">
            <label>ابعاد زمین یا واحد (متر):</label>
            <div class="inline-row">
              <input type="number" id="plotWidth" value="10" min="4" max="50" placeholder="عرض">
              <input type="number" id="plotHeight" value="12" min="4" max="50" placeholder="طول">
            </div>
          </div>

          <div class="field">
            <label>تعداد اتاق خواب:</label>
            <select id="bedCount">
              <option value="1">۱ خوابه</option>
              <option value="2" selected>۲ خوابه</option>
              <option value="3">۳ خوابه</option>
            </select>
          </div>

          <div class="field highlight-box">
            <label>🏗 تعداد طبقات ساختمان:</label>
            <div class="slider-row">
              <input type="range" id="floorsCount" min="1" max="10" value="3" step="1">
              <span id="floorsCountText" class="badge">۳ طبقه</span>
            </div>
          </div>

          <div class="field highlight-box">
            <label>🔩 نوع اسکلت سازه:</label>
            <select id="structureType">
              <option value="concrete" selected>اسکلت بتنی (ستون‌های بتنی پهن)</option>
              <option value="steel">اسکلت فلزی (تیر و ستون فولادی)</option>
            </select>
          </div>

          <div class="field">
            <label class="toggle-label">
              <input type="checkbox" id="smartColumns" checked>
              <strong>ستون‌گذاری هوشمند در کنج‌ها</strong> (بدون ستون مزاحم)
            </label>
          </div>

          <div class="field">
            <label class="toggle-label">
              <input type="checkbox" id="hideWithCabinets" checked>
              پنهان‌سازی ستون‌ها در کمد و کابینت
            </label>
          </div>

          <div class="field">
            <label class="toggle-label">
              <input type="checkbox" id="hasBalcony" checked>
              دارای بالکن / تراس
            </label>
          </div>

          <button type="button" class="primary-btn full" id="generateBtn">به‌روزرسانی و ساخت نقشه</button>
        </div>

        <div class="quick-tools">
          <p class="eyebrow">ویرایش سریع</p>
          <div class="quick-grid">
            <button type="button" class="ghost-btn" data-quick="add-bed">+ اتاق جدید</button>
            <button type="button" class="ghost-btn" data-quick="del-balcony">- حذف بالکن</button>
          </div>
        </div>
      </section>

      <section class="panel canvas-panel">
        <div class="canvas-header">
          <div class="canvas-title">
            <span class="dot"></span>
            <strong id="viewTitle">پلان دوبعدی معماری</strong>
          </div>

          <div class="zoom-toolbar" id="zoomControls2D">
            <button type="button" class="zoom-btn" id="zoomOutBtn">-</button>
            <span class="zoom-text" id="zoomLevelText">100%</span>
            <button type="button" class="zoom-btn" id="zoomInBtn">+</button>
            <button type="button" class="zoom-btn reset" id="zoomResetBtn">۱۰۰٪</button>
          </div>

          <div class="zoom-toolbar hidden" id="hint3D">
            <small class="muted-text">🖱 درگ ماوس: چرخش ۳۶۰° | اسکرول: زوم</small>
            <button type="button" class="zoom-btn" id="resetCameraBtn">زاویه اولیه</button>
          </div>
        </div>

        <div class="canvas-wrap" id="canvasWrap2D">
          <svg id="planSvg" viewBox="0 0 1200 800">
            <defs>
              <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
            <g id="viewportGroup" transform="scale(1)">
              <g id="roomsGroup"></g>
              <g id="furnitureGroup"></g>
              <g id="columnsGroup"></g>
            </g>
          </svg>
        </div>

        <div class="canvas-wrap hidden" id="canvasWrap3D"><small class="muted-text">🖱 درگ ماوس: چرخش ۳۶۰° | اسکرول: زوم</small>
            <button type="button" class="zoom-btn" id="resetCameraBtn">زاویه اولیه</button>
          </div>
        </div>

        <div class="canvas-wrap" id="canvasWrap2D">
          <svg id="planSvg" viewBox="0 0 1200 800">
            <defs>
              <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#grid)" />
            <g id="viewportGroup" transform="scale(1)">
              <g id="roomsGroup"></g>
              <g id="furnitureGroup"></g>
              <g id="columnsGroup"></g>
            </g>
          </svg>
        </div>

        <div class="canvas-wrap hidden" id="canvasWrap3D">
          <div id="threeContainer"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
